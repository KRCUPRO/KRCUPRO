<svg fill="none" viewBox="0 0 900 190" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #58a6ff; }
    .card-title-p { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #bc8cff; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #8b949e; }
    .badge-pill { rx: 6; fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .badge-txt { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #79c0ff; font-weight: 500; }
  </style>

  <!-- Left Column: Core Focus -->
  <g transform="translate(0, 0)">
    <rect width="435" height="190" rx="12" fill="url(#cardBg2)" stroke="#30363d" stroke-width="1" />
    
    <text x="24" y="32" class="card-title">⚡ Focus Areas &amp; Architecture</text>
    
    <circle cx="32" cy="62" r="3.5" fill="#38bdf8" />
    <text x="44" y="66" class="item-title">Cloud-Native &amp; Containerization</text>
    <text x="44" y="82" class="item-desc">Docker, Kubernetes &amp; NixOS declarative deployments</text>

    <circle cx="32" cy="110" r="3.5" fill="#38bdf8" />
    <text x="44" y="114" class="item-title">High-Performance Backends</text>
    <text x="44" y="130" class="item-desc">Low-latency APIs, Rate-limiting &amp; Concurrency in Go / Node</text>

    <circle cx="32" cy="158" r="3.5" fill="#38bdf8" />
    <text x="44" y="162" class="item-title">Developer Tooling &amp; Automation</text>
    <text x="44" y="176" class="item-desc">CLI utilities, Protocol integrations &amp; CI/CD</text>
  </g>

  <!-- Right Column: Engineering Highlights -->
  <g transform="translate(465, 0)">
    <rect width="435" height="190" rx="12" fill="url(#cardBg2)" stroke="#30363d" stroke-width="1" />
    
    <text x="24" y="32" class="card-title-p">🛠️ Key Capabilities</text>

    <!-- Row 1 -->
    <g transform="translate(24, 52)">
      <rect x="0" width="85" height="26" class="badge-pill" />
      <text x="42" y="17" text-anchor="middle" class="badge-txt">Go / Node</text>
      
      <rect x="95" width="95" height="26" class="badge-pill" />
      <text x="142" y="17" text-anchor="middle" class="badge-txt">TypeScript</text>

      <rect x="200" width="90" height="26" class="badge-pill" />
      <text x="245" y="17" text-anchor="middle" class="badge-txt">React / Vite</text>

      <rect x="300" width="88" height="26" class="badge-pill" />
      <text x="344" y="17" text-anchor="middle" class="badge-txt">Tailwind</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24, 92)">
      <rect x="0" width="105" height="26" class="badge-pill" />
      <text x="52" y="17" text-anchor="middle" class="badge-txt">NixOS / Flakes</text>

      <rect x="115" width="75" height="26" class="badge-pill" />
      <text x="152" y="17" text-anchor="middle" class="badge-txt">Docker</text>

      <rect x="200" width="100" height="26" class="badge-pill" />
      <text x="250" y="17" text-anchor="middle" class="badge-txt">Kubernetes</text>

      <rect x="310" width="78" height="26" class="badge-pill" />
      <text x="349" y="17" text-anchor="middle" class="badge-txt">GitOps</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(24, 132)">
      <rect x="0" width="115" height="26" class="badge-pill" />
      <text x="57" y="17" text-anchor="middle" class="badge-txt">CI/CD Pipeline</text>

      <rect x="125" width="125" height="26" class="badge-pill" />
      <text x="187" y="17" text-anchor="middle" class="badge-txt">Microservices</text>

      <rect x="260" width="128" height="26" class="badge-pill" />
      <text x="324" y="17" text-anchor="middle" class="badge-txt">API Engineering</text>
    </g>
  </g>
</svg>
