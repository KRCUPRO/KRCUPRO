<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="100%" height="100%" style="background:#0d1117; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" >
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f1319" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Border -->
  <rect x="1" y="1" width="938" height="588" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(24, 20)">
    <circle cx="10" cy="14" r="6" fill="#3fb950" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="18" fill="url(#headerGrad)" font-size="16" font-weight="700" letter-spacing="0.5">Архитектура Систем и Cloud-Native KRCUPRO</text>
    <text x="26" y="34" fill="#8b949e" font-size="11.5">Bare-Metal Кластер NixOS · Rook Ceph · FluxCD GitOps · AI-Шлюз и MCP</text>
    
    <!-- Status Badge -->
    <rect x="710" y="4" width="180" height="24" rx="12" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1" />
    <circle cx="724" cy="16" r="3.5" fill="#58a6ff" />
    <text x="734" y="20" fill="#58a6ff" font-size="9.5" font-weight="600" letter-spacing="0.5">КЛАСТЕР АКТИВЕН · ПРОДАКШЕН</text>
  </g>

  <!-- LAYER 1: EDGE & INGRESS (y=75) -->
  <g transform="translate(24, 75)">
    <rect width="892" height="62" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    <rect x="12" y="14" width="6" height="34" rx="3" fill="#58a6ff" />
    <text x="28" y="29" fill="#c9d1d9" font-size="13" font-weight="700">🌐 Cloudflare Global Edge и Двойной Ingress</text>
    <text x="28" y="45" fill="#8b949e" font-size="11">Anycast DNS · Защита от DDoS · Терминация TLS · Двойной Ingress Контроллер</text>
    <rect x="730" y="18" width="148" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="742" y="35" fill="#79c0ff" font-size="10.5" font-family="monospace">Anycast + Dual-TLS</text>
  </g>

  <!-- Connecting Lines 1 -> 2 -->
  <line x1="245" y1="138" x2="245" y2="160" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="695" y1="138" x2="695" y2="160" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- LAYER 2: AI GATEWAY & PROCESS SUPERVISOR (y=160) -->
  <g transform="translate(24, 160)">
    <!-- Box 1: AI Gateway -->
    <rect x="0" y="0" width="436" height="80" rx="8" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.2" />
    <rect x="12" y="14" width="5" height="52" rx="2.5" fill="#58a6ff" />
    <text x="26" y="32" fill="#79c0ff" font-size="12.5" font-weight="700">⚡ Корпоративный AI-Шлюз (myu-gateway)</text>
    <text x="26" y="50" fill="#8b949e" font-size="10.5">Динамическая Маршрутизация · Квоты Токенов · Отказоустойчивость &lt;5мс</text>
    <text x="26" y="66" fill="#58a6ff" font-size="10" font-family="monospace">CCR Routing · Quota Bucket · Failover &lt;5ms</text>

    <!-- Box 2: Native Go Supervisor & MCP -->
    <rect x="456" y="0" width="436" height="80" rx="8" fill="url(#cardGrad)" stroke="#8957e5" stroke-width="1.2" />
    <rect x="468" y="14" width="5" height="52" rx="2.5" fill="#bc8cff" />
    <text x="482" y="32" fill="#d2a8ff" font-size="12.5" font-weight="700">⚙️ Нативный Go Супервизор Процессов и MCP</text>
    <text x="482" y="50" fill="#8b949e" font-size="10.5">Blue/Green Изоляция Python · Распределенные MCP Агенты · Защита DPAPI</text>
    <text x="482" y="66" fill="#bc8cff" font-size="10" font-family="monospace">Go Supervisor · Blue/Green · DPAPI Hardware Vault</text>
  </g>

  <!-- Connecting Lines 2 -> 3 -->
  <line x1="470" y1="241" x2="470" y2="265" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- LAYER 3: 4-NODE BARE-METAL NIXOS CLUSTER (myu) (y=265) -->
  <g transform="translate(24, 265)">
    <!-- Master Enclosure -->
    <rect width="892" height="195" rx="8" fill="url(#cardGrad)" stroke="#238636" stroke-width="1.5" />
    <text x="18" y="24" fill="#56d364" font-size="12.5" font-weight="700">☸️ 4-Узловой Bare-Metal NixOS Kubernetes Кластер (myu)</text>
    <rect x="740" y="10" width="138" height="20" rx="4" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="0.8" />
    <text x="748" y="24" fill="#7ee787" font-size="9.5" font-weight="600">NixOS 24.11 + K8s</text>

    <!-- 4 Nodes Grid -->
    <!-- Node 1: ken -->
    <rect x="18" y="38" width="205" height="66" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="28" y="56" fill="#58a6ff" font-size="11.5" font-weight="700">👑 ken (Управляющий Узел)</text>
    <text x="28" y="72" fill="#8b949e" font-size="10">API Сервер · etcd · NixOS Flakes</text>
    <text x="28" y="88" fill="#3fb950" font-size="9.5" font-family="monospace">● Healthy (Master)</text>

    <!-- Node 2: decker -->
    <rect x="235" y="38" width="205" height="66" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="245" y="56" fill="#79c0ff" font-size="11.5" font-weight="700">📦 decker (Рабочий Узел 1)</text>
    <text x="245" y="72" fill="#8b949e" font-size="10">Ceph OSD · Высоконагруженные AI Поды</text>
    <text x="245" y="88" fill="#3fb950" font-size="9.5" font-family="monospace">● Healthy (Worker)</text>

    <!-- Node 3: calder -->
    <rect x="452" y="38" width="205" height="66" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="462" y="56" fill="#79c0ff" font-size="11.5" font-weight="700">📦 calder (Рабочий Узел 2)</text>
    <text x="462" y="72" fill="#8b949e" font-size="10">Ceph OSD · Конвейер MCP · CNI</text>
    <text x="462" y="88" fill="#3fb950" font-size="9.5" font-family="monospace">● Healthy (Worker)</text>

    <!-- Node 4: usher -->
    <rect x="669" y="38" width="205" height="66" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="679" y="56" fill="#79c0ff" font-size="11.5" font-weight="700">📦 usher (Рабочий Узел 3)</text>
    <text x="679" y="72" fill="#8b949e" font-size="10">Ceph OSD · Ingress и Телеметрия</text>
    <text x="679" y="88" fill="#3fb950" font-size="9.5" font-family="monospace">● Healthy (Worker)</text>

    <!-- Sub-cluster: Rook Ceph & FluxCD GitOps -->
    <rect x="18" y="116" width="422" height="64" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1" />
    <rect x="28" y="126" width="4" height="44" rx="2" fill="#d29922" />
    <text x="40" y="142" fill="#e3b341" font-size="11.5" font-weight="700">🗄️ Распределенное Хранилище Rook Ceph</text>
    <text x="40" y="158" fill="#8b949e" font-size="10">Отказоустойчивые Блочные и Общие Тома · Физические NVMe/SSD</text>
    <text x="40" y="172" fill="#d29922" font-size="9.5" font-family="monospace">Ceph OSD x3 · Replicated Block Pools · Shared CephFS</text>

    <rect x="452" y="116" width="422" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1" />
    <rect x="462" y="126" width="4" height="44" rx="2" fill="#3fb950" />
    <text x="474" y="142" fill="#7ee787" font-size="11.5" font-weight="700">🔄 Декларативный GitOps с FluxCD</text>
    <text x="474" y="158" fill="#8b949e" font-size="10">Автоматическая Синхронизация Кластера · Нулевой Дрейф</text>
    <text x="474" y="172" fill="#3fb950" font-size="9.5" font-family="monospace">GitOps Auto-Sync · Nix Flakes Lock · Zero-Drift</text>
  </g>

  <!-- Connecting Lines 3 -> 4 -->
  <line x1="470" y1="461" x2="470" y2="480" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- LAYER 4: SECOPS & FORENSIC RESEARCH (y=480) -->
  <g transform="translate(24, 480)">
    <rect width="892" height="72" rx="8" fill="url(#cardGrad)" stroke="#da3633" stroke-width="1.2" />
    <rect x="12" y="14" width="5" height="44" rx="2.5" fill="#f85149" />
    <text x="26" y="32" fill="#ff7b72" font-size="12" font-weight="700">🛡️ SecOps Телеметрия и Системный Журнал Аудита</text>
    <text x="26" y="48" fill="#8b949e" font-size="10.5">Мониторинг Узлов в Реальном Времени · SSH Аудит · Движок Rust (dev-timeline)</text>
    <text x="26" y="64" fill="#f85149" font-size="10" font-family="monospace">Live Cluster Telemetry · SSH Audit Trail · Zero-Dependency Pure Rust (1,884+ Commits)</text>
    <rect x="730" y="20" width="148" height="26" rx="6" fill="#21262d" stroke="#da3633" stroke-width="0.8" />
    <text x="742" y="37" fill="#ff7b72" font-size="10" font-family="monospace">ACTIVE DEFENSE</text>
  </g>
</svg>