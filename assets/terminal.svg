<svg fill="none" viewBox="0 0 900 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .window-header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .term-title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; text-anchor: middle; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .c-green { fill: #3fb950; }
    .c-cyan { fill: #58a6ff; }
    .c-purple { fill: #bc8cff; }
    .c-orange { fill: #f0883e; }
    .c-gray { fill: #8b949e; }
    .c-white { fill: #f0f6fc; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
  </style>

  <!-- Terminal Window -->
  <rect width="900" height="320" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 888 0 Q 900 0 900 12 L 900 36 L 0 36 Z" class="window-header" />
  <circle cx="20" cy="18" r="5.5" class="dot-red" />
  <circle cx="36" cy="18" r="5.5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5.5" class="dot-green" />
  <text x="450" y="23" class="term-title">krcupro@cloud-native-box: ~</text>

  <!-- Terminal Content -->
  <g transform="translate(28, 68)" class="code-text">
    <!-- Command 1 -->
    <text x="0" y="0">
      <tspan class="c-green">➜ </tspan>
      <tspan class="c-cyan">~ </tspan>
      <tspan class="c-purple">(git:main) </tspan>
      <tspan class="c-orange">whoami --verbose</tspan>
    </text>

    <!-- Output 1 -->
    <text x="0" y="26" class="c-gray">Developer  <tspan class="c-white">: KRCUPRO</tspan></text>
    <text x="0" y="48" class="c-gray">Specialty  <tspan class="c-white">: Full-Stack &amp; Cloud-Native Systems</tspan></text>
    <text x="0" y="70" class="c-gray">Stack      <tspan class="c-cyan">: [Go, TypeScript, Docker, Kubernetes, NixOS, Python]</tspan></text>
    <text x="0" y="92" class="c-gray">Focus      <tspan class="c-white">: High Concurrency, Low Latency, Clean Architecture</tspan></text>

    <!-- Command 2 -->
    <text x="0" y="132">
      <tspan class="c-green">➜ </tspan>
      <tspan class="c-cyan">~ </tspan>
      <tspan class="c-purple">(git:main) </tspan>
      <tspan class="c-orange">systemctl status engineering.service</tspan>
    </text>

    <!-- Output 2 -->
    <text x="0" y="158" class="c-green">● active (running) <tspan class="c-gray">- Always building, automating &amp; shipping resilient code</tspan></text>
    
    <!-- Command 3 (Active Prompt) -->
    <text x="0" y="200">
      <tspan class="c-green">➜ </tspan>
      <tspan class="c-cyan">~ </tspan>
      <tspan class="c-purple">(git:main) </tspan>
      <rect x="108" y="188" width="8" height="15" class="cursor" />
    </text>
  </g>
</svg>
