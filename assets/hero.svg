<svg fill="none" viewBox="0 0 900 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 2px; fill: url(#neonText); filter: drop-shadow(0 0 12px rgba(79, 172, 254, 0.4)); }
    .tagline { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; fill: #94a3b8; font-weight: 400; }
    .badge-wrap { fill: #1e293b; stroke: #3b82f6; stroke-width: 1.5; rx: 12; }
    .badge-text { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; }
    .grid-pattern { stroke: rgba(56, 189, 248, 0.05); stroke-width: 1; }
    .status-dot { fill: #10b981; filter: drop-shadow(0 0 6px #10b981); }
  </style>

  <!-- Background -->
  <rect width="900" height="200" rx="16" fill="url(#neonBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g class="grid-pattern">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="150" y1="0" x2="150" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="450" y1="0" x2="450" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="750" y1="0" x2="750" y2="200" />
  </g>

  <!-- Content Container -->
  <g transform="translate(48, 45)">
    <!-- Status Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="12" r="4.5" class="status-dot" />
      <text x="26" y="16" class="badge-text">OPEN FOR COLLAB</text>
    </g>

    <!-- Main Name Header -->
    <text x="0" y="65" class="title">KRCUPRO</text>
    <text x="0" y="96" class="tagline">Cloud-Native Architect • Backend &amp; Distributed Systems Explorer</text>
  </g>

  <!-- Top Right Neon Graphic Elements -->
  <g transform="translate(730, 45)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#neonText)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="50" cy="50" r="25" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <circle cx="50" cy="50" r="8" fill="#a855f7" filter="drop-shadow(0 0 8px #a855f7)" />
  </g>
</svg>
