<svg fill="none" viewBox="0 0 900 180" width="900" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; fill: #8b949e; }
    .badge { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 12px; fill: #58a6ff; }
  </style>

  <rect width="900" height="180" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  
  <g transform="translate(48, 50)">
    <text x="0" y="0" class="badge">👋 Hello, world! I am</text>
    <text x="0" y="42" class="title">KRCUPRO</text>
    <text x="0" y="76" class="subtitle">Software Engineer &amp; Tech Enthusiast based in Seoul.</text>
  </g>
