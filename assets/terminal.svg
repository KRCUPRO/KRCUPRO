<svg fill="none" viewBox="0 0 850 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
          border: 1px solid #30363d;
          border-radius: 12px;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);
          font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
          color: #c9d1d9;
          padding: 16px 20px 24px 20px;
          box-sizing: border-box;
          height: 360px;
          overflow: hidden;
          position: relative;
        }

        .header {
          display: flex;
          align-items: center;
          margin-bottom: 16px;
          border-bottom: 1px solid #21262d;
          padding-bottom: 12px;
        }

        .dots {
          display: flex;
          gap: 7px;
        }

        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .title {
          flex: 1;
          text-align: center;
          font-size: 13px;
          color: #8b949e;
          letter-spacing: 0.5px;
        }

        .content {
          font-size: 13px;
          line-height: 1.6;
        }

        .prompt {
          color: #7ee787;
          font-weight: bold;
        }

        .path {
          color: #79c0ff;
        }

        .branch {
          color: #d2a8ff;
        }

        .cmd {
          color: #f0883e;
        }

        .output {
          color: #e6edf3;
          margin-top: 4px;
          margin-bottom: 12px;
        }

        .key {
          color: #79c0ff;
        }

        .string {
          color: #a5d6ff;
        }

        .highlight {
          color: #58a6ff;
          font-weight: 600;
        }

        .badge {
          display: inline-block;
          padding: 2px 8px;
          border-radius: 4px;
          font-size: 11px;
          margin-right: 6px;
          margin-top: 4px;
          border: 1px solid rgba(88, 166, 255, 0.3);
          background: rgba(56, 189, 248, 0.1);
          color: #58a6ff;
        }

        .cursor {
          display: inline-block;
          width: 8px;
          height: 15px;
          background: #58a6ff;
          vertical-align: middle;
          margin-left: 4px;
          animation: blink 1s infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }

        .glow-line {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(90deg, #58a6ff, #bc8cff, #f0883e);
        }
      </style>

      <div class="container">
        <div class="header">
          <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="title">krcupro@cloud-native-dev: ~</div>
        </div>

        <div class="content">
          <div>
            <span class="prompt">➜</span> <span class="path">~</span> <span class="branch">(git:main)</span> <span class="cmd">neofetch --developer</span>
          </div>
          <div class="output">
            <div><span class="key">User:</span> <span class="string">KRCUPRO (Building for the cloud-native era)</span></div>
            <div><span class="key">Role:</span> <span class="string">Full-Stack &amp; Systems Engineer</span></div>
            <div><span class="key">Specialties:</span> <span class="string">High-Concurrency Backends, Cloud-Native, DevOps</span></div>
            <div><span class="key">Core Stack:</span> 
              <span class="badge">Go</span>
              <span class="badge">TypeScript</span>
              <span class="badge">Docker</span>
              <span class="badge">Kubernetes</span>
              <span class="badge">NixOS</span>
            </div>
            <div><span class="key">Philosophy:</span> <span class="string">"Simplicity is prerequisite for reliability."</span></div>
          </div>
          <div>
            <span class="prompt">➜</span> <span class="path">~</span> <span class="branch">(git:main)</span> <span class="cmd">status --uptime</span>
          </div>
          <div class="output" style="color: #7ee787;">
            ✔ All systems operational. Ready for next-gen scalable engineering.<span class="cursor"></span>
          </div>
        </div>
        <div class="glow-line"></div>
      </div>
    </div>
  </foreignObject>
</svg>
