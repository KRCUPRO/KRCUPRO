<svg fill="none" viewBox="0 0 900 130" width="900" height="130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .metric-value { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .bg-bar { fill: #1e293b; rx: 4; }
    .bar { rx: 4; }
  </style>

  <rect width="900" height="130" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

  <!-- Metric 1 -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="metric-label">High-Concurrency API Gateway &amp; Rate-Limiting Engine</text>
    <text x="840" y="0" text-anchor="end" class="metric-value">99.9% Uptime / 0.01s Switch</text>
    <rect x="0" y="8" width="840" height="8" class="bg-bar" />
    <rect x="0" y="8" width="820" height="8" fill="url(#barGrad1)" class="bar" />
  </g>

  <!-- Metric 2 -->
  <g transform="translate(30, 62)">
    <text x="0" y="0" class="metric-label">Model Context Protocol (MCP) Tools Implementation</text>
    <text x="840" y="0" text-anchor="end" class="metric-value">41+ Tools (Stitch / AI Studio / NLM)</text>
    <rect x="0" y="8" width="840" height="8" class="bg-bar" />
    <rect x="0" y="8" width="790" height="8" fill="url(#barGrad2)" class="bar" />
  </g>

  <!-- Metric 3 -->
  <g transform="translate(30, 100)">
    <text x="0" y="0" class="metric-label">Zero-Loss Local Storage &amp; Cross-Platform Containerization</text>
    <text x="840" y="0" text-anchor="end" class="metric-value">Docker • Nix Flake • Go Native</text>
    <rect x="0" y="8" width="840" height="8" class="bg-bar" />
    <rect x="0" y="8" width="810" height="8" fill="url(#barGrad3)" class="bar" />
  </g>
</svg>
