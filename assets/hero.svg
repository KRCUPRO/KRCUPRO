<svg fill="none" viewBox="0 0 900 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.4; r: 3.5; }
    }
    .status-dot { fill: #10b981; animation: pulseDot 2s infinite ease-in-out; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; font-weight: 600; fill: #10b981; letter-spacing: 1px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 38px; letter-spacing: 1.5px; fill: url(#neonTitle); }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; fill: #8b949e; }
    .highlight-text { fill: #e6edf3; font-weight: 600; }
  </style>

  <!-- Background Card -->
  <rect width="900" height="160" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Status pill -->
  <g transform="translate(45, 26)">
    <rect width="140" height="22" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <circle cx="14" cy="11" class="status-dot" />
    <text x="26" y="15" class="status-text">SYSTEM ONLINE</text>
  </g>

  <!-- Main Info -->
  <g transform="translate(45, 84)">
    <text x="0" y="0" class="title-text">KRCUPRO</text>
    <text x="0" y="32" class="desc-text">Full-Stack &amp; Cloud-Native Systems Engineer · Specializing in <tspan class="highlight-text">Go</tspan>, <tspan class="highlight-text">TypeScript</tspan>, <tspan class="highlight-text">NixOS</tspan> &amp; <tspan class="highlight-text">K8s</tspan></text>
  </g>

  <!-- Right Decorative Icon/Grid -->
  <g transform="translate(740, 35)">
    <circle cx="45" cy="45" r="42" fill="none" stroke="#30363d" stroke-dasharray="4 4" />
    <circle cx="45" cy="45" r="30" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="45" cy="45" r="6" fill="#38bdf8" />
  </g>
</svg>
